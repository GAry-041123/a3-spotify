@if (loading) { <p role="status">Loading album...</p> }
@if (error) { <p class="alert alert-danger" role="alert">{{ error }}</p> }
@if (album) {
  <div class="row">
    <div class="col-12 col-sm-6">
      <h1>{{ album.name }}</h1>
      <img id="albumImg" class="img-fluid mw-100" [src]="album.imageURL" [alt]="album.name">
      <app-thermometer [popularity]="album.popularity"></app-thermometer>
      @for (artist of album.artists; track $index) {
        <p>Artist: <a [routerLink]="['/artist', artist.id]">{{ artist.name }}</a></p>
      }
      <p><a class="btn btn-light" [href]="album.url" target="_blank" rel="noopener noreferrer">Open {{ album.name }} on Spotify</a></p>
    </div>
    <div class="col-12 col-sm-6">
      <h3>Album Tracks</h3>
      <app-track-list [tracks]="tracks" [hideArtist]="true" [hideAlbum]="true"></app-track-list>
    </div>
  </div>
}
