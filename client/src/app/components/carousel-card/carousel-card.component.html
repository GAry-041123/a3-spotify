@if (resource) {
  <a [routerLink]="['/', resource.category, resource.id]" [attr.aria-label]="'View ' + resource.name">
    <img class="d-block w-100" [src]="resource.imageURL" [alt]="resource.name" style="aspect-ratio: 1; object-fit: cover;">
    <div class="carousel-caption d-block bg-dark bg-opacity-75 rounded p-2">
      <h5 class="mb-0 text-white">{{ resource.name }}</h5>
    </div>
  </a>
}
