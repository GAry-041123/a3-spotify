<div class="progress" role="progressbar" [attr.aria-label]="label" [attr.aria-valuenow]="percentage" aria-valuemin="0" aria-valuemax="100">
  <div class="progress-bar" [style.background-color]="color" [style.width.%]="percentage">
    <span class="progress-bar-text text-white">{{ label }}: {{ percentage | number:'1.0-0' }}%</span>
  </div>
</div>
