@if (resources && resources.length) {
  <div [id]="carouselId" class="carousel slide carousel-fade mw-100" aria-label="Browse results" aria-roledescription="carousel">
    <div class="carousel-inner">
      @for (resource of resources; track resource; let first = $first) {
        <app-carousel-card class="carousel-item" [class.active]="first" [resource]="resource"></app-carousel-card>
      }
    </div>
    @if (resources.length > 1) {
      <button type="button" class="carousel-control-prev m-0" [attr.data-bs-target]="carouselIdForBinding" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button type="button" class="carousel-control-next m-0" [attr.data-bs-target]="carouselIdForBinding" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    }
  </div>
}
