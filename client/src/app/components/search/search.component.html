<h1>Search Spotify</h1>
<form (ngSubmit)="search()" class="d-flex flex-wrap align-items-center">
  <label for="search-query" class="visually-hidden">Search query</label>
  <input id="search-query" name="query" [(ngModel)]="searchString" placeholder="Artist, album, or track" class="form-control w-auto">
  <label for="search-category" class="visually-hidden">Search category</label>
  <select id="search-category" name="category" [(ngModel)]="searchCategory" (ngModelChange)="search()" class="form-select w-auto">
    @for (category of searchCategories; track category) {
      <option [value]="category">{{ category | titlecase }}</option>
    }
  </select>
  <button type="submit" class="btn btn-light" [disabled]="!searchString.trim()">Search</button>
</form>
@if (loading) { <p role="status">Searching...</p> }
@if (error) { <p class="alert alert-danger" role="alert">{{ error }}</p> }
@if (searched) {
  <p role="status">{{ resources.length }} {{ resultCategory }} results</p>
  @if (resources.length === 0) {
    <p>No results found. Try another search.</p>
  } @else if (resultCategory === 'track') {
    <app-track-list [tracks]="tracks"></app-track-list>
  } @else {
    <app-carousel [resources]="resources" carouselId="search-results"></app-carousel>
  }
}
